<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Western Australia 2027</title>
<meta name="theme-color" content="#F2E8D7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WA 2027">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,600,100;1,9..144,500,100&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: travel-journal app; sunset hero, route map left (sticky), stop cards right; one column on phones */
:root{
  --bg:#F2E8D7; --surface:#FBF6EC; --ink:#2F2519; --muted:#7A6A55; --line:#E3D5BD;
  --ocean:#2E6E70; --ocean-soft:#DCE5DC; --earth:#C0612A; --earth-soft:#F6DFCB; --warn:#9A5B00; --warn-soft:#F7E6C4;
  --land:#E8D5B0; --coast:#C9A878; --sun:#E9A23B; --dune1:#E7C79C; --dune2:#D79A62; --dune3:#B8693A;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Nunito Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1812; --surface:#28211A; --ink:#F2E7D4; --muted:#B6A48B; --line:#3E342A;
  --ocean:#86BDB3; --ocean-soft:#22302C; --earth:#EC9660; --earth-soft:#3D2618; --warn:#E9B44C; --warn-soft:#3A2C14;
  --land:#3B3024; --coast:#6A5440; --sun:#E9A23B; --dune1:#5A4430; --dune2:#7A4E2E; --dune3:#9C5A30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1812; --surface:#28211A; --ink:#F2E7D4; --muted:#B6A48B; --line:#3E342A;
  --ocean:#86BDB3; --ocean-soft:#22302C; --earth:#EC9660; --earth-soft:#3D2618; --warn:#E9B44C; --warn-soft:#3A2C14;
  --land:#3B3024; --coast:#6A5440; --sun:#E9A23B; --dune1:#5A4430; --dune2:#7A4E2E; --dune3:#9C5A30; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.55;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.005em}
h1{font-size:clamp(32px,7vw,54px);line-height:1}
h2{font-size:21px}
.eyebrow{font-family:var(--display);font-style:italic;font-weight:500;font-size:15px;color:var(--earth)}
.top{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px 92px;display:grid;gap:12px}
.top>*{position:relative;z-index:1}
.top .land{position:absolute;inset:auto 0 0 0;width:100%;height:110px;z-index:0}
.tagline{color:var(--muted);margin:0;max-width:52ch}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--bg);border-radius:999px;padding:5px 13px}
.stat b{font-weight:700;font-size:15px}
.stat span{color:var(--muted);font-size:13px;margin-left:4px}
.start{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:700;background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--muted);padding:8px 18px;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--surface);background:var(--ink);border-color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--earth);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{background:var(--earth);color:var(--surface);border:0;border-radius:999px;padding:8px 16px;font-weight:700;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--earth)}
.btn:disabled{opacity:.5;cursor:default}
.route{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:860px){.route:not(.trip){grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}

.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
#lmap{height:clamp(420px,48vw,560px);border-radius:10px;background:var(--ocean-soft);z-index:0}
@media (max-width:859px){#lmap{height:62vh}}
.leaflet-tile-pane{filter:sepia(.28) saturate(.85) brightness(1.02)}
:root[data-theme="dark"] .leaflet-tile-pane{filter:sepia(.3) brightness(.75) contrast(1.05)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:sepia(.3) brightness(.75) contrast(1.05)}}
.leaflet-container{font-family:var(--body)}
.num{display:flex;align-items:center;justify-content:center;height:26px;border-radius:999px;font-family:var(--body);font-weight:700;font-size:12.5px;line-height:1;white-space:nowrap;border:2px solid var(--surface);box-sizing:border-box;cursor:pointer}
.num.base{background:var(--earth);color:var(--surface)}
.num.day{background:var(--surface);color:var(--ocean);border-color:var(--ocean)}
.num.opt{border-style:dashed}
.num.sel{outline:3px solid var(--ink);outline-offset:1px}
.arw{pointer-events:none}
.snum{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;margin-right:8px;border-radius:999px;background:var(--earth);color:var(--surface);font-family:var(--body);font-size:12.5px;font-weight:700;vertical-align:3px}
.tip{font-family:var(--body);font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.tip::before{display:none}
.btn.small{padding:4px 12px;font-size:13px;margin-left:auto}
#auth{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.pill.on{background:var(--ocean-soft);color:var(--ocean)}
.pill.off{background:var(--warn-soft);color:var(--warn)}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);padding:8px 4px 2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.log{list-style:none;margin:0;padding:0;display:grid}
.section-h{padding:14px 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.stop.sel{border-color:var(--earth)}
.stop-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 14px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;padding:13px 15px}
.daybox{font-size:12px;line-height:1.25;color:var(--muted);min-width:58px;text-align:center;border-right:1px solid var(--line);padding-right:12px;grid-row:span 2}
.daybox b{display:block;color:var(--earth);font-family:var(--display);font-weight:600;font-size:16px}
.sname{font-family:var(--display);font-weight:600;font-size:19px;min-width:0}
.ssub{color:var(--muted);font-size:13px;grid-column:2/4;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--earth-soft);color:var(--earth)}
.chip.day{background:var(--ocean-soft);color:var(--ocean)}
.chip.opt{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.chip.guess::after{content:"?"}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:8px 0 8px 34px;margin-left:44px;border-left:2px dashed var(--dune2);font-size:13px;font-style:italic;color:var(--muted)}
.leg a{color:var(--ocean);font-style:normal;font-weight:700}
.leg .long{background:var(--warn-soft);color:var(--warn);padding:2px 9px;border-radius:999px;font-style:normal;font-weight:700}
.ed{border-top:1px solid var(--line);padding:15px;display:grid;gap:12px}
.ed .eyebrow{font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.hl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hl li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:6px;align-items:center}
.x{background:none;border:1px solid var(--line);border-radius:50%;color:var(--muted);width:34px;height:34px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm{background:var(--earth-soft);color:var(--earth);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.note{font-size:13px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:400}
.num{text-align:right!important}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--dune2)}
.scroll{overflow-x:auto}
.pack{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.pack li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.pack li.done span{text-decoration:line-through;color:var(--muted)}
.pack input[type=checkbox]{width:20px;height:20px;accent-color:var(--earth)}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700}
.fchip span{font-weight:400;color:var(--muted);margin-left:4px;font-size:12.5px}
.fchip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fchip.on span{color:var(--surface);opacity:.75}
select.who{width:auto;border-radius:999px;padding:3px 8px;font-size:12.5px;font-weight:700;border-color:transparent}
.who-Isabel:not(.fchip){background:var(--ocean-soft);color:var(--ocean)}
.who-Colin:not(.fchip){background:var(--earth-soft);color:var(--earth)}
.who-Amalia:not(.fchip){background:var(--warn-soft);color:var(--warn)}
.who-Family:not(.fchip){background:var(--bg);color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-style:italic}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;max-width:calc(100% - 32px)}
.status{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:8px 12px}
@media (prefers-reduced-motion:no-preference){.stop{transition:border-color .15s}.land .sun{animation:rise 1.6s ease-out both}@keyframes rise{from{transform:translateY(24px);opacity:.3}to{transform:none;opacity:1}}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <svg class="land" viewBox="0 0 400 110" preserveAspectRatio="none" aria-hidden="true">
      <circle class="sun" cx="318" cy="58" r="26" fill="var(--sun)" opacity=".85"/>
      <path d="M0 70 C70 50 130 62 200 58 C270 54 330 40 400 56 L400 110 L0 110Z" fill="var(--dune1)"/>
      <path d="M0 86 C90 66 160 84 240 76 C310 70 360 74 400 70 L400 110 L0 110Z" fill="var(--dune2)"/>
      <path d="M0 100 C80 90 170 104 260 96 C330 90 370 98 400 94 L400 110 L0 110Z" fill="var(--dune3)"/>
    </svg>
    <div class="eyebrow">Our camper adventure · April–May 2027</div>
    <h1>Western Australia 2027</h1>
    <p class="tagline">From Perth along the wild south coast to Esperance, then north past the Pinnacles to the dolphins of Shark Bay.</p>
    <div class="stats" id="stats"></div>
    <div id="auth"></div>
    <label class="start" for="startDate">Arrival in Perth <input id="startDate" type="date" style="width:auto" data-f="start" data-scope="settings"></label>
  </header>
  <nav class="tabs" aria-label="Sections">
    <button data-act="tab" data-tab="route" aria-current="true">Route</button>
    <button data-act="tab" data-tab="budget" aria-current="false">Budget</button>
    <button data-act="tab" data-tab="packing" aria-current="false">Packing</button>
  </nav>
  <div id="status" class="status" hidden></div>
  <main id="app"><div class="empty">Loading your route, budget and packing list…</div></main>
</div>
<div id="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
