<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Western Australia 2027</title>
<meta name="theme-color" content="#0E1A20">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WA 2027">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,600,100;1,9..144,500,100&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: travel-journal app; ocean-at-night header, full-width route map, stop list below. Single dark theme ("Indian Ocean night"). */
:root{
  --bg:#0E1A20; --surface:#15252C; --ink:#E6F0F1; --muted:#9FB6BB; --line:#24363D;
  --ocean:#4FB3C2; --ocean-ink:#062027; --ocean-soft:#0F2A35; --earth:#F08A6C; --earth-ink:#2B0F06; --earth-soft:#3E2219; --warn:#E9B44C; --warn-soft:#33290F;
  --sun:#F08A6C; --dune1:#123039; --dune2:#17414C; --dune3:#1F5764;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Nunito Sans", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.55;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.005em}
h1{font-size:clamp(32px,7vw,54px);line-height:1}
h2{font-size:21px}
.eyebrow{font-family:var(--display);font-style:italic;font-weight:500;font-size:15px;color:var(--earth)}
.top{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px 92px;display:grid;gap:12px}
.top>*{position:relative;z-index:1}
.top .sun{position:absolute;right:17%;bottom:86px;width:58px;height:58px;border-radius:50%;background:var(--sun);opacity:.9;z-index:0}
@media (max-width:600px){.top .sun{right:6%;bottom:60px;width:42px;height:42px}}
.top .land{position:absolute;inset:auto 0 0 0;width:100%;height:110px;z-index:0}
.tagline{color:var(--muted);margin:0;max-width:52ch}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--bg);border-radius:999px;padding:5px 13px}
.stat b{font-weight:700;font-size:15px}
.stat span{color:var(--muted);font-size:13px;margin-left:4px}
.dates{display:grid;gap:8px;min-width:0}
.top>*{min-width:0}
.drow{min-width:0}
.drow{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.dlab{width:88px;flex:none;font-size:13.5px;color:var(--muted)}
.dash{color:var(--muted);flex:none}
.drow input[type=date]{-webkit-appearance:none;appearance:none;width:0;min-width:0;max-width:150px;flex:1 1 0;height:38px;padding:6px 10px;font-size:15px;line-height:1.2;text-align:left}
.drow input[type=date]::-webkit-date-and-time-value{text-align:left}
@media (max-width:420px){.dlab{width:58px;font-size:12.5px;line-height:1.2}.drow{gap:5px}.drow input[type=date]{padding:6px 6px;font-size:14px}.drow input[type=date]::-webkit-calendar-picker-indicator{display:none}}
#datesum:empty{display:none}
#datesum .warn{color:var(--warn)}
.start{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:700;background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--muted);padding:8px 18px;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--ocean-ink);background:var(--ocean);border-color:var(--ocean)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--earth);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{background:var(--earth);color:var(--earth-ink);border:0;border-radius:999px;padding:8px 16px;font-weight:700;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--earth)}
.btn:disabled{opacity:.5;cursor:default}
.route{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:860px){.route:not(.trip){grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}

.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
#lmap{height:clamp(420px,48vw,560px);border-radius:10px;background:var(--ocean-soft);z-index:0}
@media (max-width:859px){#lmap{height:62vh}}
.leaflet-control-layers{background:var(--surface);color:var(--ink);border:1px solid var(--line)!important;border-radius:999px!important;box-shadow:none!important;padding:3px!important}
.leaflet-control-layers-base{display:flex;gap:2px}
.leaflet-control-layers-base label{margin:0}
.leaflet-control-layers-base label>span{display:block;cursor:pointer}
.leaflet-control-layers-base input{position:absolute;opacity:0;pointer-events:none}
.leaflet-control-layers-base label span span{display:block;padding:5px 12px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--muted)}
.leaflet-control-layers-base input:checked+span{background:var(--ocean);color:var(--ocean-ink);border-radius:999px}
.leaflet-control-layers-base input:checked+span span{color:var(--ocean-ink)}
.leaflet-control-layers-base input:focus-visible+span{outline:2px solid var(--earth);outline-offset:1px}
.leaflet-top.leaflet-right{display:flex;flex-direction:row-reverse;align-items:flex-start;gap:8px;margin-right:10px}
.leaflet-top.leaflet-right .leaflet-control{margin:10px 0 0 0;float:none;clear:none}
.surftoggle{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
.surftoggle.on{background:var(--warn);border-color:var(--warn);color:#2A1E05}
.surftoggle:focus-visible{outline:2px solid var(--earth);outline-offset:2px}
.leaflet-control-layers{height:36px;display:flex;align-items:center}
.leaflet-control-layers-list{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.leaflet-control-layers-separator{display:none}
.leaflet-control-layers-overlays{display:flex}
.leaflet-control-layers-overlays label{margin:0}
.leaflet-control-layers-overlays input{position:absolute;opacity:0;pointer-events:none}
.leaflet-control-layers-overlays label span span{display:block;padding:5px 12px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer}
.leaflet-control-layers-overlays input:checked+span{background:var(--warn);border-radius:999px;color:#2A1E05}
.leaflet-control-layers-overlays input:checked+span span{color:#2A1E05}
.leaflet-control-layers-overlays input:focus-visible+span{outline:2px solid var(--earth);outline-offset:1px}
.surfpin{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--warn);color:#2A1E05;border:2px solid var(--bg);box-sizing:border-box;cursor:pointer}
.chip.lv-beginner{background:#173A2E;color:#7FD1AE}
.chip.lv-intermediate{background:var(--warn-soft);color:var(--warn)}
.chip.lv-advanced{background:#3A1A1A;color:#F09090}
.surfpin.lvl-beginner{background:#7FD1AE}
.surfpin.lvl-advanced{background:#E06A6A}
#lmap.placing{cursor:crosshair}
.btn.small.on{background:var(--warn);color:#2A1E05;border-color:var(--warn)}
.sfpop .leaflet-popup-content-wrapper,.sfpop .leaflet-popup-tip{background:var(--surface);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.sfpop .leaflet-popup-content{margin:12px}
.sfpop a.leaflet-popup-close-button{color:var(--muted)}
.sfp{display:grid;gap:8px;font-family:var(--body);font-size:14px}
.sfp p{margin:0}
.sfp textarea{min-height:84px}
.leaflet-container{font-family:var(--body);background:var(--ocean-soft)}
.leaflet-bar a{background:var(--surface);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--line);color:var(--ink)}
.leaflet-bar{border:1px solid var(--line)!important}
.leaflet-control-attribution{background:rgba(14,26,32,.8)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--ocean)}
.num{display:flex;align-items:center;justify-content:center;height:26px;border-radius:999px;font-family:var(--body);font-weight:700;font-size:12.5px;line-height:1;white-space:nowrap;border:2px solid var(--surface);box-sizing:border-box;cursor:pointer}
.num.base{background:var(--earth);color:var(--earth-ink)}
.num.day{background:var(--surface);color:var(--ocean);border-color:var(--ocean)}
.num.opt{border-style:dashed}
.num.sel{outline:3px solid var(--ink);outline-offset:1px}
.arw{pointer-events:none}
.snum{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;margin-right:8px;border-radius:999px;background:var(--earth);color:var(--earth-ink);font-family:var(--body);font-size:12.5px;font-weight:700;vertical-align:3px}
.tip{font-family:var(--body);font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.tip::before{display:none}
.btn.small{padding:4px 12px;font-size:13px;margin-left:auto}
#auth{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#auth{justify-content:flex-end;font-size:13px}
#auth form{justify-content:flex-end}
@media (min-width:861px){#auth{position:absolute;top:18px;right:20px;max-width:46%;z-index:2}}
@media (max-width:860px){#auth{order:-1}}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.pill.on{background:var(--ocean-soft);color:var(--ocean)}
.pill.off{background:var(--warn-soft);color:var(--warn)}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);padding:8px 4px 2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.log{list-style:none;margin:0;padding:0;display:grid}
.section-h{padding:14px 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.stop.sel{border-color:var(--earth)}
.stop-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 14px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;padding:13px 15px}
.daybox{font-size:12px;line-height:1.25;color:var(--muted);min-width:58px;text-align:center;border-right:1px solid var(--line);padding-right:12px;grid-row:span 2}
.daybox b{display:block;color:var(--earth);font-family:var(--display);font-weight:600;font-size:16px}
.sname{font-family:var(--display);font-weight:600;font-size:19px;min-width:0}
.ssub{color:var(--muted);font-size:13px;grid-column:2/4;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--earth-soft);color:var(--earth)}
.chip.day{background:var(--ocean-soft);color:var(--ocean)}
.chip.opt{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.chip.guess::after{content:"?"}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:8px 0 8px 34px;margin-left:44px;border-left:2px dashed var(--dune2);font-size:13px;font-style:italic;color:var(--muted)}
.leg a{color:var(--ocean);font-style:normal;font-weight:700}
.leg .long{background:var(--warn-soft);color:var(--warn);padding:2px 9px;border-radius:999px;font-style:normal;font-weight:700}
.ed{border-top:1px solid var(--line);padding:15px;display:grid;gap:12px}
.ed .eyebrow{font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.hl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hl li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:6px;align-items:center}
.x{background:none;border:1px solid var(--line);border-radius:50%;color:var(--muted);width:34px;height:34px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notebody{min-height:180px;line-height:1.55}
.notelinks{display:grid;gap:4px;font-size:14px}
.notelinks a{color:var(--ocean);word-break:break-all}
.actbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.confirm{background:var(--earth-soft);color:var(--earth);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.note{font-size:13px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:400}
.num{text-align:right!important}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--dune2)}
.scroll{overflow-x:auto}
.pack{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.pack li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.pack li.done .ptext{text-decoration:line-through;color:var(--muted)}
.ptext{background:transparent;border:1px solid transparent;padding:5px 8px;border-radius:8px}
.ptext:hover{border-color:var(--line)}
.ptext:focus{background:var(--bg);border-color:var(--line)}
.pack input[type=checkbox]{width:20px;height:20px;accent-color:var(--earth)}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700}
.fchip span{font-weight:400;color:var(--muted);margin-left:4px;font-size:12.5px}
.fchip.on{background:var(--ocean);color:var(--ocean-ink);border-color:var(--ocean)}
.fchip.on span{color:var(--ocean-ink);opacity:.75}
select.who{width:auto;border-radius:999px;padding:3px 8px;font-size:12.5px;font-weight:700;border-color:transparent}
.who-Isabel:not(.fchip){background:var(--ocean-soft);color:var(--ocean)}
.who-Colin:not(.fchip){background:var(--earth-soft);color:var(--earth)}
.who-Amalia:not(.fchip){background:var(--warn-soft);color:var(--warn)}
.who-Family:not(.fchip){background:var(--bg);color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-style:italic}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;max-width:calc(100% - 32px)}
.status{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:8px 12px}
@media (prefers-reduced-motion:no-preference){.stop{transition:border-color .15s}.top .sun{transform:translateY(100px);opacity:.4}.top.up .sun{animation:rise 2.8s cubic-bezier(.25,.6,.3,1) .2s forwards}@keyframes rise{from{transform:translateY(100px);opacity:.4}to{transform:none;opacity:.9}}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="sun" aria-hidden="true"></div>
    <svg class="land" viewBox="0 0 400 110" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 70 C70 50 130 62 200 58 C270 54 330 40 400 56 L400 110 L0 110Z" fill="var(--dune1)"/>
      <path d="M0 86 C90 66 160 84 240 76 C310 70 360 74 400 70 L400 110 L0 110Z" fill="var(--dune2)"/>
      <path d="M0 100 C80 90 170 104 260 96 C330 90 370 98 400 94 L400 110 L0 110Z" fill="var(--dune3)"/>
    </svg>
    <div class="eyebrow">Our camper adventure · April–May 2027</div>
    <h1>Western Australia 2027</h1>
    <p class="tagline">From Perth along the wild south coast to Esperance, then north past the Pinnacles to the dolphins of Shark Bay.</p>
    <div class="stats" id="stats"></div>
    <div id="auth"></div>
    <div class="dates">
      <div class="drow"><span class="dlab">In Australia</span><input id="startDate" type="date" data-f="start" data-scope="settings" aria-label="Arrival in Perth"><span class="dash">–</span><input id="departDate" type="date" data-f="depart" data-scope="settings" aria-label="Departure from Perth"></div>
      <div class="drow"><span class="dlab">Road trip</span><input id="rtStart" type="date" data-f="rtStart" data-scope="settings" aria-label="Road trip start"><span class="dash">–</span><input id="rtEnd" type="date" data-f="rtEnd" data-scope="settings" aria-label="Road trip end"></div>
    </div>
    <div class="note" id="datesum"></div>
  </header>
  <nav class="tabs" aria-label="Sections">
    <button data-act="tab" data-tab="route" aria-current="true">Route</button>
    <button data-act="tab" data-tab="surf" aria-current="false">Surf</button>
    <button data-act="tab" data-tab="budget" aria-current="false">Budget</button>
    <button data-act="tab" data-tab="packing" aria-current="false">Packing</button>
    <button data-act="tab" data-tab="notes" aria-current="false">Notes</button>
  </nav>
  <div id="status" class="status" hidden></div>
  <main id="app"><div class="empty">Loading your route, budget and packing list…</div></main>
</div>
<div id="toast" hidden></div>

<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script defer src="config.js"></script>
<script defer src="app.js"></script>
<script>addEventListener("load",()=>requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelector(".top")?.classList.add("up"))))</script>
</body>
</html>
